# >>> ProSafeAV revision tasks (generated) >>>

# ProSafeAV main configuration: heterogeneous IDM/MOBIL traffic at a medium density, logistic extreme-value copula, EVT penalty applied both in the environment reward and inside latent imagination.
carla_overtake_prosafeav:
  env:
    name: CarlaOvertakeEnv-v0
    observation.enabled: [collision, birdeye_wpt]
    nonego_spawn_points:
      - [5.8, 80.0, 0.1, 0.0, -90.0, 0.0]
      - [12.2, 80.0, 0.1, 0.0, -90.0, 0.0]
    lane_start_points:
      - [5.8, 100, 0.1]
    lane_end_points:
      - [5.8, 0.0, 0.1]
    lane_centres: [5.8, 9.0, 12.2, 15.6]
    background_controller: idm_mobil
    traffic_density: 15          # background vehicles per km per lane
    background_speed_range: [6.0, 12.0] # desired speed of background traffic (m/s)
    target_speed: 4.0                   # desired speed of the overtaken vehicle (m/s)
    spawn_gap_range: [12.0, 45.0]
    aggressive_fraction: 0.25
    ego_gap_range: [15.0, 45.0]          # initial ego-to-target gap (m)
    ego_offset_lane_prob: 0.3   # chance the ego starts one lane over
    ego_initial_speed_range: [2.0, 6.0]
    # Injected pre-crash scenarios (Najm et al., NHTSA 2007 typology).
    # Free-flowing IDM/MOBIL traffic keeps safe headways by construction and
    # can run a whole episode without a conflict, leaving the EVT model with
    # nothing to fit.  These transiently override the calibrated behaviour.
    conflict_events:
      lead_brake:      { prob: 0.5, trigger_distance: [12.0, 30.0], duration: [0.8, 2.0], intensity: [0.6, 1.0] }
      cut_in:          { prob: 0.4, trigger_distance: [8.0, 22.0], duration: [1.5, 3.0], intensity: [0.6, 1.2] }
      stopped_vehicle: { prob: 0.25, trigger_distance: [0.0, 0.0], duration: [0.0, 0.0], intensity: [0.0, 0.0] }
    swing_steer: 0.04
    swing_amplitude: 0.2
    swing_trigger_dist: 20
    pid_coeffs: [0.03, 0.0, 0.03]
    evt:
      mode: both          # none | env | imagine | both
      copula: logistic          # logistic (manuscript) | frank (sensitivity check)
      threshold_method: stability   # stability | mrl | quantile
      threshold_ttc: null       # null selects the threshold from the data
      threshold_drac: null
      update_interval: 2000     # environment steps between refits
      buffer_size: 20000
      min_sample: 300
      min_exceedances: 30
      ttc_cap: 30.0            # no-interaction cutoff, NOT the conflict threshold
      risk_tolerance: 0.0     # u in Eq. (6)
      indicator_mode: max  # max | longitudinal | planar
      interaction_radius: 50.0
      crash_drac: 8.5
    reward:
      desired_speed: 5
      reward_overtake_dist: 8
      early_lane_change_dist: 10
      lane_width: 3.4
      scales:
        {
          waypoint: 2.0,
          speed: 0.5,
          stay_same_lane: 0.3,
          out_of_lane: 3.0,
          collision: 30.0,
          time: 0.0,
          evt: 3.0,
          exceeding: 200.0,
          overtake: 200.0,
          early_lane_change: 0.0,
          destination_reached: 20.0,
        }
    terminal:
      out_lane_thres: 5
      time_limit: 500
      left_lane_boundry: 3.7
      right_lane_boundry: 17.7
      lane_width: 3.4
      terminal_dist: 100

  dreamerv3:
    encoder.cnn_keys: "birdeye_wpt"
    decoder.cnn_keys: "birdeye_wpt"
    run.log_keys_video: [birdeye_wpt]
    run.log_keys_max: "collision"
    # Matched against observation keys. In eval mode the environment folds
    # its info dict into the observations under an eval_ prefix, which is
    # how the conflict and EVT quantities reach the result tables.
    run.log_keys_mean: "(log_entropy|eval_|ttc|drac|evt_|speed_|conflict_|closing_|n_interacting|n_background|initial_gap|wpt_dis)"
    evt.mode: both
    evt.imag_weight: 3.0

  dreamerv2:
    encoder.cnn_keys: "birdeye_wpt"
    decoder.cnn_keys: "birdeye_wpt"
    decoder.cnn_kernels: [5, 5, 5, 6, 6]
    train.log_keys_video: [birdeye_wpt]

